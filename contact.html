<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | MUNTAHA WEBSITE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Specific layout for the new form fields */
        .name-row {
            display: flex;
            gap: 10px;
        }
        .gender-box {
            margin: 10px 0;
            text-align: left;
        }
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">MUNTAHA WEBSITE</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="contact.html">Contact/Register</a></li>
        </ul>
    </nav>

    <section class="section">
        <div class="grid-container">
            <div class="card">
                <h2 style="color:var(--accent); margin-bottom: 15px;">Contact Me</h2>
                <p><strong>Name:</strong> Muntaha Aden</p>
                <p><strong>Tel:</strong> +251907159922</p>
                <p><strong>Email:</strong> muntaha@gmail.com</p>
            </div>

            <div class="card">
                <h2 style="margin-bottom: 20px;">Register</h2>
                <form>
                    <div class="name-row">
                        <input type="text" placeholder="First Name" required>
                        <input type="text" placeholder="Second Name" required>
                    </div>

                    <input type="email" placeholder="Gmail Address" required>
                    
                    <input type="tel" placeholder="Phone Number" required>

                    <div class="gender-box">
                        <p style="color:var(--text-secondary); font-size: 0.9rem; margin-bottom: 5px;">Gender</p>
                        <select required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">Register Now</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Muntaha Aden | Submission Date: May 13</p>
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('reveal'); });
        });
        document.querySelectorAll('.card').forEach(c => observer.observe(c));
    </script>
</body>
</html>
